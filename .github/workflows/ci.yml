name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AGENT_API_KEY: ci-dummy
  REDIS_URL: "fake://"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (exclude cp5 and bonus)
        run: pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t day12-agent:prod .

      - name: Check image size
        run: |
          SIZE=$(docker images day12-agent:prod --format "{{.Size}}")
          echo "Image size: $SIZE"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "Deploy step is a placeholder for CI/CD demo"
          echo "In production, this would deploy to Railway/Render"
          echo "PUBLIC_URL: ${{ vars.PUBLIC_URL }}"

      - name: Wait
        run: sleep 5

      - name: Smoke test placeholder
        run: |
          echo "Smoke test placeholder - URL: ${{ vars.PUBLIC_URL }}"
          echo "OK"